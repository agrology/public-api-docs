    Nodes:
      type: array
      description: The nodes the caller can access.
      items:
        $ref: "#/components/schemas/Node"
    GeoJSONCollection:
      type: object
      description: >-
        A GeoJSON FeatureCollection with one feature per site and per node, plus Agrology URL templates.
      properties:
        key:
          type: string
          description: >-
            What the collection covers: a site ID, a customer ID, or `user-access-list`.
        description:
          type: string
          description: Name of what the collection covers.
        classification:
          type: string
          description: Customer classification. Only on customer collections.
        historicalURL:
          type: string
          description: >-
            `https://api.agrology.ag/v2/historical/ground-truth/{site}`. Fill in `{site}` with a site ID and add `/{timeRange}`, which the route requires.
        predictionsURL:
          type: string
          description: >-
            `https://api.agrology.ag/v2/predictions/{dataset}/{site}`. `{dataset}` is `weather`, `microclimate` or `pest-disease`, and `{site}` is a site ID.
        syntheticsURL:
          type: string
          description: >-
            `https://api.agrology.ag/v2/synthetics/{dataset}/{site}`. `{dataset}` is `microclimate` and `{site}` is a site ID. Add `/{timeRange}`, which the route requires.
        sites:
          type: array
          description: IDs of the sites in the collection.
          items:
            type: string
        type:
          type: string
          description: Always `FeatureCollection`.
        features:
          type: array
          description: One feature per site and per node.
          items:
            $ref: "#/components/schemas/GeoJSONFeature"
    GeoJSONFeature:
      type: object
      description: A GeoJSON feature for one site or node.
      required: [properties]
      properties:
        type:
          type: string
          description: Always `Feature`.
        properties:
          $ref: "#/components/schemas/GeoJSONProperties"
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
    GeoJSONProperties:
      type: object
      description: >-
        Properties of a feature. `elementType` says which kind it is: address, contact and unit fields appear on site features; `id`, devices and soil fields on node features.
      properties:
        elementType:
          type: string
          description: '`site` or `node`.'
        siteClassificaiton:
          type: string
          description: Label for the site. The name is a typo kept for compatibility.
        name:
          type: string
          description: Name for display.
        customer:
          type: string
          description: Customer ID. On site features only.
        deviceIDs:
          type: array
          description: Device IDs. Same data as `deviceIds`.
          items:
            type: string
        deviceIds:
          type: array
          description: Device IDs.
          items:
            type: string
        devices:
          type: object
          description: Device details, keyed by device ID.
          additionalProperties:
            $ref: "#/components/schemas/GeoJSONDeviceData"
        elevationMeters:
          type: integer
          description: Elevation in metres.
        site:
          type: string
          description: Site ID.
        role:
          type: string
          description: >-
            The caller's access role at the site, e.g. `viewer`. On site features only.
        products:
          type: array
          description: Products active at the site.
          items:
            type: string
        crops:
          type: array
          description: Crops at this node.
          items:
            type: string
        address1:
          type: string
          description: Address line 1.
        address2:
          type: string
          description: Address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State or province.
        country:
          type: string
          description: Country.
        postalCode:
          type: string
          description: Postal code.
        contactName:
          type: string
          description: Site contact name.
        contactEmail:
          type: string
          description: Site contact email.
        contactPhone:
          type: string
          description: Site contact phone.
        displayUnits:
          type: string
          description: Units at the site, `metric` or `imperial`.
        latitude:
          type: number
          description: Latitude in decimal degrees.
        longitude:
          type: number
          description: Longitude in decimal degrees.
        acreage:
          type: number
          description: Size in acres.
        timezone:
          type: string
          description: Time zone name.
        id:
          type: string
          description: Node ID, on node features only. Site features use `site`.
        soilType:
          type: string
          description: Soil type.
        soilDensity:
          type: number
          description: Soil density.
        activeSoilDepty:
          type: number
          description: Active soil depth. The name is a typo kept for compatibility.
        soilMoistureStdDev:
          type: number
          description: Standard deviation of soil moisture.
        soilMoistureMean:
          type: number
          description: Mean soil moisture.
    GeoJSONDeviceData:
      type: object
      description: A device on a feature.
      properties:
        make:
          type: string
          description: Device manufacturer.
        model:
          type: string
          description: Device type ID.
        deviceType:
          type: string
          description: Device type ID.
        probeDepth:
          type: number
          description: Probe depth.
        needsMaintenance:
          type: boolean
          description: True when the device reports a status other than `ok`.
        maintenanceDetail:
          type: string
          description: Detail for `needsMaintenance`.
        lastMessage:
          type: integer
          format: int64
          description: Time of the last message, in epoch milliseconds.
        lastPayload:
          type: string
          description: Last raw payload.
        isMonitored:
          type: boolean
          description: True unless monitoring is muted for this device.
        position:
          type: string
          description: Position of the device.
    GeoJSONGeometry:
      type: object
      description: >-
        GeoJSON geometry for a feature. Absent for a site with no boundary or a node with no latitude or longitude.
      properties:
        type:
          type: string
          description: '`Point`, `Polygon` or `MultiPolygon`.'
        coordinates:
          description: >-
            As in RFC 7946. A Point is `[long, lat]`. A Polygon is a list of rings, each a list of `[long, lat]` positions, so a site boundary is `[[[long, lat], ...]]`. A MultiPolygon is a list of Polygons.
    DeviceType:
      type: object
      description: A type of device and the metrics it reports.
      required: [id, description, metrics]
      properties:
        id:
          type: string
          description: >-
            Device type ID, used in the `deviceType` query parameter. Not unique: entries can share an ID and differ in `metrics`.
        description:
          type: string
          description: Name of the device type.
        metrics:
          type: array
          nullable: true
          description: Metrics this device type reports. Can be null.
          items:
            $ref: "#/components/schemas/Metric"
    DeviceTypes:
      type: array
      description: The device types.
      items:
        $ref: "#/components/schemas/DeviceType"
    ReportRun:
      type: object
      description: One execution of a report.
      required: [customerID, id, ts, reportDefinitionID, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        customerID:
          type: string
          description: Customer that owns the run.
        id:
          type: string
          description: Report run ID.
        ts:
          type: integer
          format: int64
          description: When the run was requested, in epoch seconds.
        status:
          type: string
          description: >-
            `new` until the generator finishes, then `success`. A run that failed can still show `success`, with or without `files`, and `files` can name a file that was never stored. A run whose definition is invalid stays `new`.
        reportDefinitionID:
          type: string
          description: Report definition this run belongs to.
        executionTimeMS:
          type: integer
          format: int64
          description: How long the run took, in milliseconds.
        files:
          type: array
          description: >-
            Names of the generated files. Each is stored at `reports/<runID>/<name>`: pass that as `file` to `/fileserver/customer/{customerID}`.
          items:
            type: string
        results:
          type: object
          description: Run details, if any.
        createdAt:
          type: integer
          format: int64
          description: When the report run was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the report run, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the report run last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the report run, usually an email address.
    ReportRuns:
      type: array
      description: Report runs, newest first.
      items:
        $ref: "#/components/schemas/ReportRun"
    ReportDefinition:
      type: object
      description: What a report contains and when it runs.
      required: [id, customerID, description, reportType, entryType, recipients, scope, targetID, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        id:
          type: string
          description: Report definition ID.
        customerID:
          type: string
          description: Customer that owns the report.
        description:
          type: string
          description: Report title.
        reportType:
          type: string
          description: Report type. Stored as sent.
        aggregateFiles:
          type: string
          description: 'Level each output file covers: `customer`, `site` or `node`.'
        aggregateCharts:
          type: string
          description: 'Level each chart covers: `customer`, `site` or `node`.'
        entryType:
          type: string
          description: 'How the report runs: `daily`, `weekly`, `monthly` or `manual`.'
        cadenceDayOfMonth:
          type: integer
          format: int64
          description: >-
            Day of the month for a monthly report, or `99` for the last day, as the portal uses it.
        cadenceDayOfWeek:
          type: integer
          format: int64
          description: >-
            Day of the week for a weekly report, as the portal numbers it: 1 is Monday and 7 is Sunday.
        cadenceHour:
          type: integer
          format: int64
          description: Hour of the scheduled run.
        cadenceMinute:
          type: integer
          format: int64
          description: Minute of the scheduled run.
        emailEnabled:
          type: integer
          description: '`1` to email the report to the recipients.'
        recipients:
          type: array
          nullable: true
          description: Email addresses that receive the report.
          items:
            type: string
        cc:
          type: array
          description: Addresses copied on the email.
          items:
            type: string
        bcc:
          type: array
          description: Addresses blind-copied on the email.
          items:
            type: string
        scope:
          type: string
          description: 'What the report covers: `customer`, `site` or `node`.'
        targetID:
          type: string
          description: >-
            ID of the site or node that `scope` names. Ignored for `customer`, which always means the owning customer.
        timeRange:
          type: string
          description: >-
            Period the report covers: a relative range such as `4w-`, or one of `l7d`, `lw`, `lm`, `ly`, `mtd`, `ytd` or `snl`.
        lastRan:
          type: integer
          format: int64
          description: When the report last started, in epoch seconds.
        lastRanStatus:
          type: string
          description: Status of the latest run.
        lastRunID:
          type: string
          description: ID of the latest run.
        reportFormat:
          type: string
          description: >-
            Output format: `pdf` or `csv`. Send one: with none, no file is produced.
        metadata:
          type: object
          description: Further report options, as string keys and values.
          additionalProperties:
            type: string
        createdAt:
          type: integer
          format: int64
          description: When the report definition was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the report definition, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the report definition last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the report definition, usually an email address.
    ReportDefinitions:
      type: array
      description: Report definitions.
      items:
        $ref: "#/components/schemas/ReportDefinition"
    LibraryChart:

  /nodes:
    get:
      summary: List your nodes
      description: >-
        Full fleet records for the nodes you can access. For callers with site grants, leaves out inactive nodes, nodes with no latitude or longitude, and every node at a site that is inactive, has no display name or fails to load. An automation credential gets every active node in the fleet instead, with none of the other filters. Cached for 5 minutes per caller. Returns 401 when no nodes remain.

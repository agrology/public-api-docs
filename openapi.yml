## COMPONENTS SCHEMAS
components:
  parameters:
    SiteID:
      name: siteID
      in: path
      required: true
      description: Site ID, from /access or /sites. Older sites use a slug (e.g. austin-research-station), newer ones a UUID.
      schema:
        type: string
    NodeID:
      name: nodeID
      in: path
      required: true
      description: Node ID (a UUID), from /access or /nodes.
      schema:
        type: string
    DeviceID:
      name: deviceID
      in: path
      required: true
      description: Device ID (EUI), from /historical/ground-truth/{siteID}/devices.
      schema:
        type: string
    CustomerID:
      name: customerID
      in: path
      required: true
      description: Customer ID, from /access (siteAccess[].customer).
      schema:
        type: string
    TimeRange:
      name: timeRange
      in: path
      required: true
      description: >-
        `{start}-{end}`, or a single relative time with no end (`4h` is the same as `4h-`). An empty end means now, except on predictions, where it means the last stored forecast point. Each side is `now`; a relative time `<n>s`, `m`, `h`, `d` or `w` in the past (e.g. `6h`), or in the future with a `+` prefix (`+2d`, used by forecasts); epoch seconds (10 digits); epoch milliseconds (13 digits); or `20yyMMddhhmm` / `20yyMMddhhmmss` in UTC. The special value `newest` returns the latest-dated sample of each series, not a single sample. On site timeseries, predictions included, it considers samples from 24 hours ago onwards with no upper bound; a series with nothing in that window is left out. A series is one node and metric (ground truth also splits by device and position; historical weather keeps one sample per node). On predictions (weather, microclimate, pest & disease) the latest-dated sample is the furthest-ahead forecast point while the series has future points, and its newest past point otherwise. On experiment data a series is one experiment group, with no time limit. Examples: `4h`, `6h-4h`, `1d-now`, `1618203722-1618290149`, `202108010000-`, `newest`.
      schema:
        type: string
    Resolution:
      name: resolution
      in: query
      description: >-
        Bucket size in seconds: a positive divisor of 86400 or a multiple of 86400. 2592000 means calendar months, except at `responseVersion` 2.0, which returns raw samples for it. Other positive values are ignored, as if `resolution` were absent. Do not send `0` (the request fails with a 502) or a negative value (negative divisors of 86400 are not rejected and give undefined results). `bucketSize` is accepted as an alias.
      schema:
        type: integer
    Statistic:
      name: statistic
      in: query
      description: >-
        How samples in a bucket combine, with `resolution`; the default is `mean`, and unknown values also give `mean`. `runningTotal` sums each bucket and accumulates across buckets; without `resolution` it accumulates the raw samples. Without `resolution`, every other value is ignored. `runningTotal` accumulates only on `SampleV21` samples: not at `responseVersion` 2.0, and not at 2.2 on weather and microclimate predictions or synthetics below calendar-month resolution. There it gives bucket sums with `resolution` and raw samples without it. At 2.0, `resolution=2592000` returns raw samples for every statistic. Below calendar-month resolution, use only `mean`, `sum`, `min`, `max` or `runningTotal`: the others are sent to the database as function names MySQL does not have, which gives a 400. On pest and disease, only `resolution=2592000` buckets, so no statistic reaches the database and this 400 does not apply; `runningTotal` still accumulates the raw samples at 2.1 or 2.2, and with `newest` any other accepted `resolution` is a 400. At calendar months, `geomean` of a series with a zero or negative value also gives a 400. `bucketOp` is accepted as an alias.
      schema:
        type: string
        enum: [mean, sum, min, max, median, geomean, varsamp, stddevsamp, varpop, stddevpop, runningTotal]
    Metrics:
      name: metrics
      in: query
      description: >-
        Comma-separated metric IDs to include, from the matching `/metrics` endpoint (e.g. `airTemp,humidity`). `metric` is accepted as an alias. On ground truth, predictions and synthetics, unknown IDs are ignored, and if none is known the filter is dropped and every metric comes back. On historical weather, if none is known the samples have no metrics.
      schema:
        type: string
    DeviceType:
      name: deviceType
      in: query
      description: Comma-separated device type IDs to include, from /historical/ground-truth/device-types (e.g. `gV1,co2`).
      schema:
        type: string
    Format:
      name: format
      in: query
      description: >-
        `json` (default) or `csv`. Any other value is a 400 on every operation. Only timeseries operations at response version 2.0 or 2.1 produce CSV; everything else returns JSON.
      schema:
        type: string
        enum: [json, csv]
        default: json
    ResponseVersion:
      name: responseVersion
      in: query
      description: >-
        Timeseries response shape: `2.0` (the default), `2.1` or `2.2` (the latest). Unknown values are ignored and give 2.0.
      schema:
        type: string
        enum: ["2.0", "2.1", "2.2"]
        default: "2.0"
    DisableRedirects:
      name: disableRedirects
      in: query
      description: >-
        Applies to every operation. Responses over 5,000,000 bytes are uploaded to S3 and answered with a 302 to a presigned URL that expires after 1 hour; the body is a `RedirectBody`. With `1`, the status is 200 instead of 302, but the body is still the `RedirectBody` (`"code": 302`). The timeseries and experiment-data operations include it in their 200 schema; on other operations it is not the documented 200 schema.
      schema:
        type: string
        enum: ["1"]
    RefID:
      name: refID
      in: query
      description: Any string. Echoed as `request.refID` in 2.1 and 2.2 timeseries responses.
      schema:
        type: string
    ShowPast:
      name: showPast
      in: query
      description: '`1` also returns predictions for times already past.'
      schema:
        type: string
        enum: ["1"]
    ConsolidateNodePositionMetrics:
      name: consolidateNodePositionMetrics
      in: query
      description: >-
        `1` merges samples from all of a node's devices at the same position into one series. Samples are then keyed `<nodeID>-<positionID>` instead of by device ID.
      schema:
        type: string
        enum: ["1"]
    Owner:
      name: owner
      in: path
      required: true
      description: >-
        Dashboard owner: your own email address, or `customer.<customerID>` for a dashboard shared with a customer. This value is not URL-decoded, so send `@` as it is.
      schema:
        type: string
    ItemID:
      name: id
      in: path
      required: true
      description: ID of the item, as returned by its create or list operation.
      schema:
        type: string
    ExperimentID:
      name: experimentID
      in: path
      required: true
      description: Experiment ID, from the experiment list.
      schema:
        type: string
    GroupID:
      name: groupID
      in: path
      required: true
      description: Experiment group ID, from the group list.
      schema:
        type: string
    FilePath:
      name: file
      in: query
      required: true
      description: >-
        Path of the file in storage, URL-encoded, such as the key of an `s3://` location returned by another endpoint.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: >-
        One `key:v1,v2` filter. Keys, in any case: `deviceType`, `metrics` or `metric`, `deviceID`, `nodeID`, `position`. Other keys and unknown values are ignored, and a filter with no known values is dropped.
      schema:
        type: string
    Position:
      name: position
      in: query
      description: >-
        Comma-separated position names: `Soil Chamber`, `Ground Level`, `Canopy`, `PM` or `GPS`. Unknown names are ignored, and if none is known the filter is dropped.
      schema:
        type: string
    ExperimentResolution:
      name: resolution
      in: path
      required: true
      description: >-
        Rollup size in seconds: 1800, 3600, 14400, 21600, 43200, 86400, 259200, 604800 or 2592000. Any other value is a 400.
      schema:
        type: integer
    ExperimentCols:
      name: cols
      in: query
      description: >-
        Comma-separated `metric|nodeAggregator|statistic` columns to include, in any case. Replaces `metrics` and `statistic`.
      schema:
        type: string
    ExperimentMetrics:
      name: metrics
      in: query
      description: >-
        Comma-separated metric IDs to include, matched exactly against the metric part of each column. Ignored with `cols`. `metric` is accepted as an alias.
      schema:
        type: string
    ExperimentStatistic:
      name: statistic
      in: query
      description: >-
        Comma-separated statistics to include, matched exactly against the statistic part of each column. This is a column filter, not an aggregation: the rollup has already applied it. Ignored with `cols`. `runningTotal` drops the filter. Do not also send a query `resolution`: it changes this filter, and sets one even with no `statistic`. `bucketOp` is accepted as an alias.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        Invalid input: a bad path or query parameter, an unknown `format`, or a body that fails validation. Many handlers also answer 400 for failures after validation, such as a database error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        No valid credential, or no access to this resource. An expired token gives `{"code": 401, "message":"the incoming token has expired"}`. Other failures give `{"code": 401, "message":"{"status":"unauthorized"}"}`, which is not valid JSON, so treat a 401 body as text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        The experiment or group in the path does not exist or is not the customer's, or for a member write, the node is not one of the customer's active nodes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TimeseriesData:
      description: >-
        The data. CSV at response version 2.0 or 2.1: `ts,dateTime,nodeId,nodeName,<metric columns>`, with no `text/csv` Content-Type. With `format=csv` and no columns, the body is empty. Fields are not quoted, so a comma in a node name shifts that row. JSON at 2.2.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Timeseries"
        text/csv:
          schema:
            type: string
    GroundTruthData:
      description: >-
        The readings. CSV at response version 2.0: `ts,dateTime,nodeId,nodeName,<metric columns>`. At 2.1, `dev`, `deviceType` and `position` come before the metric columns when the data has them. No `text/csv` Content-Type is sent. With `format=csv` and no columns, the body is empty. Fields are not quoted, so a comma in a node name shifts that row. JSON at 2.2.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Timeseries"
        text/csv:
          schema:
            type: string
    Redirect:
      description: >-
        The body was over 5,000,000 bytes, so it was uploaded to S3. Follow `Location`, a presigned URL that expires after 1 hour. Any operation can answer this way; the timeseries and experiment-data operations declare it. With `disableRedirects=1` the status is 200 but the body is still this `RedirectBody`.
      headers:
        Location:
          description: Presigned S3 URL of the full response body.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RedirectBody"
  schemas:
    AlertList:
      type: object
      description: >-
        Active alerts, shaped for an Apple push notification. With no alerts, the body is `{"aps":{}}`.
      required: [aps]
      properties:
        aps:
          $ref: "#/components/schemas/AlertPushService"
        alerts:
          type: array
          description: The alerts. Omitted when there are none.
          items:
            $ref: "#/components/schemas/Alert"
    AlertPushService:
      type: object
      description: Apple push notification fields.
      properties:
        alert:
          type: string
          description: >-
            Notification title, `Alerts for <customer name>`, or the customer ID when the name cannot be read. Omitted when there are no alerts.
    Alert:
      type: object
      description: One active alert.
      required: [eventValues]
      properties:
        id:
          type: string
          description: Alert ID.
        insight:
          type: string
          description: Alert category.
        startTime:
          type: string
          format: date-time
          description: When the alert started, as an RFC 3339 time in UTC.
        endTime:
          type: string
          format: date-time
          description: Not set today, so always omitted.
        updateTime:
          type: string
          format: date-time
          description: Same as `startTime` today.
        customer:
          type: string
          description: Customer the alert is for.
        site:
          type: string
          description: Main site the alert is for.
        sites:
          type: array
          description: Every site the alert affects.
          items:
            type: string
        severity:
          type: string
          description: Not set today, so always omitted.
        certainty:
          type: string
          description: Not set today, so always omitted.
        urgency:
          type: string
          description: Not set today, so always omitted.
        eventValues:
          $ref: "#/components/schemas/AlertValues"
    AlertValues:
      type: object
      description: What the alert is about.
      required: [location]
      properties:
        origin:
          type: string
          description: 'Source of the alert: `Agrology` unless the alert names another.'
        title:
          type: string
          description: >-
            Short title: the alert's own subject if it has one, otherwise one such as `Fire in Area`, `Red Flag Warning`, `Extreme Temperature Warning` or `Agrology Notification`.
        headline:
          type: string
          description: Alert text.
        distance:
          type: number
          format: double
          description: Not set today, so always omitted.
        direction:
          type: number
          format: double
          description: Not set today, so always omitted.
        location:
          $ref: "#/components/schemas/AlertLocation"
        points:
          type: array
          description: Points of the affected area, as the alert source sent them.
          items:
            type: array
            items:
              type: number
              format: double
    AlertLocation:
      type: object
      description: Where the alert is. `{}` when the alert has no position.
      properties:
        type:
          type: string
          description: '`Point`.'
        coordinates:
          type: array
          description: '`[latitude, longitude]`: the opposite order to GeoJSON.'
          items:
            type: number
    CustomerAccessEntry:
      type: object
      description: One user's access to a customer. Empty fields are omitted.
      properties:
        email:
          type: string
          description: The user's email address, in lower case.
        site:
          type: string
          description: >-
            Site of a site-level grant. Always omitted here: this list has customer-level grants only.
        customer:
          type: string
          description: Customer the access is for.
        role:
          type: string
          description: 'Access level: `viewer`, `editor` or `admin`.'
        fromScope:
          type: string
          description: Usually omitted here.
        addedBy:
          type: string
          description: Who granted the access.
        lastModifiedBy:
          type: string
          description: Who last changed the access level.
        creationDate:
          type: integer
          format: int64
          description: When the access was granted, in epoch seconds.
        lastModified:
          type: integer
          format: int64
          description: When the access level last changed, in epoch seconds.
    CustomerAccessList:
      type: array
      description: Users with customer-level access.
      items:
        $ref: "#/components/schemas/CustomerAccessEntry"
    ExperimentInput:
      type: object
      description: >-
        Fields to set on an experiment. Omitted fields are left unchanged on update. Values are stored as sent. `notice`, `noticeLevel`, `noticeExpires` and `nextOperation` cannot be set here.
      properties:
        description:
          type: string
          description: Experiment title.
        status:
          type: string
          description: >-
            `planned`, `ongoing` or `completed`. Not validated; use `unset` to clear it. Rollups run only for `ongoing`. Once `endTime` has passed, a rollup run can set `completed`.
        notes:
          type: string
          description: Free-form notes.
        startTime:
          type: integer
          format: int64
          description: >-
            When the experiment starts, in epoch milliseconds, not seconds. Send it on create: it is not enforced, and without it rollups start from 1970.
        endTime:
          type: integer
          format: int64
          description: >-
            When the experiment ends, in epoch milliseconds, not seconds. A value in the past can end the experiment: a rollup run then sets `status` to `completed`.
        positionFilter:
          type: string
          description: >-
            Display name of the one position to include, such as `Canopy` or `Soil Chamber`. It applies to ground-truth metrics only; synthetic metrics use every position. An unknown name is ignored.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    ExperimentGroupInput:
      type: object
      description: >-
        Fields to set on an experiment group. Omitted fields are left unchanged on update.
      properties:
        description:
          type: string
          description: Group name.
        groupType:
          type: string
          description: >-
            Kind of group. The portal offers `control`, `trial` and `other`; any string is stored.
        notes:
          type: string
          description: Free-form notes.
        icon:
          type: string
          description: Icon to show for the group.
        color:
          type: string
          description: Color to show for the group.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    ExperimentMemberInput:
      type: object
      description: >-
        Fields to set on an experiment member. Omitted fields are left unchanged on update.
      properties:
        experimentID:
          type: string
          description: >-
            Experiment whose node list includes this member. Required on create: send the same, non-empty value as in the path. A different value on update moves the member to the node list of that experiment.
        color:
          type: string
          description: Color to show for the node.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared. Clearing `experimentID` drops the member from that list.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    ExperimentMetricInput:
      type: object
      description: >-
        Fields to set on an experiment metric. Omitted fields are left unchanged on update. Values are stored as sent: an unknown `statistic` or `nodeAggregator` is not reported here, but it stops every rollup for the experiment. An experiment whose only metric has an unknown `metricID` also fails, also without an error here.
      properties:
        metricID:
          type: string
          description: >-
            ID of the metric to roll up. Needed on create: it is not enforced, and a missing or unknown ID gives no data.
        statistic:
          type: string
          description: >-
            How the values of the nodes in a group combine: `mean`, `sum`, `min`, `max`, `median`, `geomean`, `varsamp`, `stddevsamp`, `varpop`, `stddevpop`, `runningTotal` or `rawValue`. Case-sensitive. Empty means `mean`. `rawValue` takes one value instead of combining, so use it only for single-node groups. `runningTotal` sums the nodes and accumulates only within each rollup run: after a full rebuild it is a total from `startTime`, until the next scheduled run restarts the latest periods from zero.
        resolution:
          type: integer
          description: >-
            Rollup size in seconds: 1800, 3600, 14400, 21600, 43200, 86400, 259200, 604800 or 2592000. Needed on create: other values, including a missing one, are stored, but the data operations reject them.
        nodeAggregator:
          type: string
          description: >-
            How each node's samples in a rollup period combine, before `statistic`. It takes the same values as `statistic`, except that `runningTotal` is a plain sum here and `rawValue` keeps every sample. Empty means `mean`.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    DashboardInput:
      type: object
      description: >-
        Fields to set on a dashboard. Omitted fields are left unchanged on update. Changing `dataField0` moves the old value to `dataField1`, and each older version down one place; the oldest is lost.
      properties:
        feature:
          type: string
          description: Feature the dashboard belongs to. Needed on create.
        featureID:
          type: string
          description: ID of the item within that feature. Needed on create.
        description:
          type: string
          description: Dashboard title.
        notes:
          type: string
          description: Free-form notes.
        notice:
          type: string
          description: Temporary message to show the user about this dashboard.
        noticeLevel:
          type: string
          description: 'Severity of `notice`: `info`, `warning`, `error` or `success`.'
        order:
          type: integer
          description: >-
            Position of the dashboard in its collection (same owner and feature ID).
        status:
          type: string
          description: >-
            Dashboard status. To delete or restore, use those operations: `deleted` here sets no expiry, and `active` here does not cancel one.
        dataField0:
          type: string
          description: >-
            The live dashboard content, a free-form string owned by the client.
        dataField1:
          type: string
          description: >-
            Rollback version 1. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField2:
          type: string
          description: >-
            Rollback version 2. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField3:
          type: string
          description: >-
            Rollback version 3. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField4:
          type: string
          description: >-
            Rollback version 4. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField5:
          type: string
          description: >-
            Rollback version 5. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField6:
          type: string
          description: >-
            Rollback version 6. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField7:
          type: string
          description: >-
            Rollback version 7. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField8:
          type: string
          description: >-
            Rollback version 8. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        dataField9:
          type: string
          description: >-
            Rollback version 9. Dropped if `dataField0` changes in the same request. Sent with no other change, it is ignored.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared. `dataField1` to `dataField9` cannot be cleared. Clearing `featureID` drops the dashboard from the feature list, so it can then be reached only by its ID.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    LibraryChartInput:
      type: object
      description: >-
        Fields to set on a library chart. Omitted fields are left unchanged on update.
      properties:
        description:
          type: string
          description: Chart title.
        folder:
          type: string
          description: Folder the chart is filed under.
        definition:
          type: string
          description: >-
            The chart's query definition, a JSON document encoded as a string.
        settings:
          type: string
          description: Display settings, a JSON document encoded as a string.
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    ReportDefinitionInput:
      type: object
      description: >-
        Fields to set on a report definition. Omitted fields are left unchanged on update. Values are stored as sent, and a bad value is not reported later: a run can show `success` with no `files`. A report needs `scope`, `timeRange` and `reportFormat` to produce anything, and `targetID` unless `scope` is `customer`.
      properties:
        description:
          type: string
          description: Report title.
        reportType:
          type: string
          description: Report type. Stored as sent.
        aggregateFiles:
          type: string
          description: 'Level each output file covers: `customer`, `site` or `node`.'
        aggregateCharts:
          type: string
          description: 'Level each chart covers: `customer`, `site` or `node`.'
        entryType:
          type: string
          description: 'How the report runs: `daily`, `weekly`, `monthly` or `manual`.'
        cadenceDayOfMonth:
          type: integer
          format: int64
          description: >-
            Day of the month for a monthly report, or `99` for the last day, as the portal uses it.
        cadenceDayOfWeek:
          type: integer
          format: int64
          description: >-
            Day of the week for a weekly report, as the portal numbers it: 1 is Monday and 7 is Sunday.
        cadenceHour:
          type: integer
          format: int64
          description: Hour of the scheduled run.
        cadenceMinute:
          type: integer
          format: int64
          description: Minute of the scheduled run.
        emailEnabled:
          type: integer
          description: '`1` to email the report to the recipients.'
        recipients:
          type: array
          description: Email addresses that receive the report.
          items:
            type: string
        cc:
          type: array
          description: Addresses copied on the email.
          items:
            type: string
        bcc:
          type: array
          description: Addresses blind-copied on the email.
          items:
            type: string
        scope:
          type: string
          description: 'What the report covers: `customer`, `site` or `node`.'
        targetID:
          type: string
          description: >-
            ID of the site or node that `scope` names. Ignored for `customer`, which always means the owning customer.
        timeRange:
          type: string
          description: >-
            Period the report covers: a relative range such as `4w-`, or one of `l7d`, `lw`, `lm`, `ly`, `mtd`, `ytd` or `snl`.
        reportFormat:
          type: string
          description: >-
            Output format: `pdf` or `csv`. Send one: with none, no file is produced.
        metadata:
          type: object
          description: Further report options, as string keys and values.
          additionalProperties:
            type: string
        unset:
          type: array
          description: >-
            Names of properties to clear. A property sent in the same body wins, so it is not cleared.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    ReportRunInput:
      type: object
      description: The report to run.
      required: [reportDefinitionID]
      properties:
        reportDefinitionID:
          type: string
          description: ID of the report definition to run.
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    CustomerInputSubmission:
      type: object
      description: >-
        A customer input. `category` is needed on update as well as on create.
      required: [category]
      properties:
        category:
          type: string
          description: Category name, from `/customer-inputs/categories`.
        data:
          type: object
          description: >-
            Values by key. Each key must be one of the category's `requiredValues` or `optionalValues`; other keys are a 400. Keys in `requiredValues` are not enforced. Only `s3file` values are checked: each must be the HTTPS URL of a key under `uploads/customer/portal/` in this customer's upload bucket. On update, `data` replaces the whole object. Use strings and numbers: an array or object is accepted here but can make a later update fail with a 502.
        unset:
          type: array
          description: >-
            Names of properties to clear. Only `data` can be cleared, and only when `data` is not also sent.
          items:
            type: string
        changeComment:
          type: string
          description: Note recorded in the change log with this change.
    CustomerInputCategoryValue:
      type: object
      description: A key that a category accepts in `data`.
      required: [key, description, type]
      properties:
        key:
          type: string
          description: Key to use in `data`.
        description:
          type: string
          description: Label for the value.
        type:
          type: string
          description: >-
            `string`, `date`, `dateRange`, `number`, `s3file`, `gps`, or `enum.string:` followed by the allowed values, separated by commas. Send a `date` as `YYYY-MM-DD`, a `dateRange` as `YYYY-MM-DD to YYYY-MM-DD` and a `gps` as `latitude, longitude`, all as strings.
    CustomerInputCategory:
      type: object
      description: A kind of customer input.
      required: [name, requiredValues, optionalValues]
      properties:
        name:
          type: string
          description: Category name, used as `category`.
        requiredValues:
          type: array
          nullable: true
          description: Keys the category expects.
          items:
            $ref: "#/components/schemas/CustomerInputCategoryValue"
        optionalValues:
          type: array
          nullable: true
          description: Further keys the category accepts.
          items:
            $ref: "#/components/schemas/CustomerInputCategoryValue"
    CustomerInputCategories:
      type: array
      description: Every supported category.
      items:
        $ref: "#/components/schemas/CustomerInputCategory"
    Error:
      type: object
      description: >-
        Body of every error response the API's Lambda returns. (API Gateway's own 403, 429, 502 and 504 errors are `{"message": ...}` instead.) The server inserts `message` without JSON escaping, so a message containing quotes makes the body invalid JSON; see the 401 response.
      required: [code, message]
      properties:
        code:
          type: integer
          description: The HTTP status code, repeated.
        message:
          type: string
          description: What went wrong.
    Created:
      type: object
      description: Body of a 201 from a create operation.
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok`.
        id:
          type: string
          description: ID of the new item. Omitted by operations that do not assign one.
    AccessList:
      type: object
      description: The customers, sites and nodes the caller can see, and the caller's role at each site.
      required: [siteAccess]
      properties:
        siteAccess:
          type: array
          nullable: true
          description: One entry per customer the caller holds any grant under.
          items:
            $ref: "#/components/schemas/AccessCustomer"
        appRole:
          type: string
          description: '`debugger` for Agrology staff with debug access; omitted otherwise.'
    AccessCustomer:
      type: object
      description: A customer and the caller's sites under it.
      required: [customer, displayName, sites]
      properties:
        customer:
          type: string
          description: Customer ID. Older customers use a slug, newer ones a UUID.
        displayName:
          type: string
          description: Customer name for display.
        sites:
          type: object
          nullable: true
          description: The caller's sites under this customer, keyed by site ID.
          additionalProperties:
            $ref: "#/components/schemas/AccessSite"
    AccessSite:
      type: object
      description: One site the caller can access.
      required: [id, role]
      properties:
        id:
          type: string
          description: Site ID.
        displayName:
          type: string
          description: Site name for display.
        role:
          type: string
          description: The caller's role at this site, e.g. `viewer`, `editor` or `admin`.
        units:
          type: string
          description: The site's display units, `metric` or `imperial`.
        nodes:
          type: array
          description: The site's nodes.
          items:
            $ref: "#/components/schemas/AccessNode"
    AccessNode:
      type: object
      description: A node at a site.
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Node ID (a UUID).
        displayName:
          type: string
          description: Node name for display.
    Device:
      type: object
      description: A device installed at a site.
      required: [id, reportTime]
      properties:
        id:
          type: string
          description: Device ID (EUI).
        reportTime:
          type: integer
          format: int64
          description: Time of the device's last report, in epoch milliseconds.
        reportingStatus:
          type: string
          description: Reporting status from fleet monitoring.
        statusDetail:
          type: string
          description: Detail for the reporting status.
        node:
          type: string
          description: ID of the node the device belongs to.
        serial:
          type: string
          description: Manufacturer serial number.
        position:
          type: string
          description: Where on the node the device sits, e.g. `Soil Chamber`.
        deviceType:
          type: string
          description: Device type ID, as listed by /historical/ground-truth/device-types.
    Devices:
      type: array
      description: Devices at a site.
      items:
        $ref: "#/components/schemas/Device"
    UnitOption:
      type: object
      description: >-
        A display unit a client may convert a metric to. Conversion happens in the client; timeseries values stay in the metric's stored `units`.
      required: [id, label, factor]
      properties:
        id:
          type: string
          description: Stable unit identifier, e.g. `tCPerHaDay`. Safe to persist.
        label:
          type: string
          description: Display label, e.g. `t C/ha/day`.
        factor:
          type: number
          description: >-
            Multiplier from the stored unit. For raw values, mean, median, min and max: `display = stored * factor + offset`. For `stddevpop` and `stddevsamp`: `stored * factor`. For `varpop` and `varsamp`: `stored * factor^2`, and the label becomes the unit squared. For `geomean`: `stored * factor` when `offset` is 0. For `sum` and `runningTotal`: `stored * factor` when `offset` is 0 and `rateOnly` is not set. Where none of these applies, show the stored value with the metric's `units`. A `sum` or `runningTotal` of a per-day metric is a total for the period, so drop `/day` from the label. Choose the rule by the aggregation the server applied, not the `statistic` sent: without a usable `resolution`, values are raw unless `runningTotal` accumulated them. `runningTotal` never accumulates at `responseVersion` 2.0, on experiment and summary responses, or at 2.2 on weather and microclimate predictions and synthetics below calendar-month resolution. At 2.0, `resolution=2592000` gives raw values. An experiment column combines two aggregations: use the raw-value rule when both are mean, median, min or max (ignoring case), and otherwise show the stored value.
        offset:
          type: number
          description: Added after `factor`. Omitted when 0; only temperature uses it.
        rateOnly:
          type: boolean
          description: >-
            True for an option that is valid only for a rate, e.g. `umolCO2PerM2S`. Do not offer it when the applied aggregation is a sum or running total. Omitted when false.
    DefaultUnits:
      type: object
      description: The `UnitOption` to use by default in each unit system.
      required: [metric, imperial]
      properties:
        metric:
          type: string
          description: '`UnitOption` id to use when the effective unit system is metric.'
        imperial:
          type: string
          description: '`UnitOption` id to use when the effective unit system is imperial.'
    Metric:
      type: object
      description: A metric the API can return.
      required: [id]
      properties:
        id:
          type: string
          description: Metric ID, used in the `metrics` query parameter.
        displayName:
          type: string
          description: Metric name for display.
        units:
          type: string
          description: >-
            Label of the stored unit. Raw timeseries values are in this unit; `UnitOption.factor` lists the statistics that change it, such as variance and sum.
        category:
          type: string
          description: The group the metric appears under, e.g. `Climate`.
        sources:
          type: array
          description: Data sources whose `/metrics` endpoint lists this metric.
          items:
            type: string
        isPublic:
          type: boolean
          description: True if the metric is available in this API.
        isBeta:
          type: boolean
          description: True if the metric is in beta.
        minValue:
          type: number
          description: Lowest possible value, in `units`.
        maxValue:
          type: number
          description: Highest possible value, in `units`.
        unitOptions:
          type: array
          description: Display units a client may convert to. Absent when the metric is shown only in `units`.
          items:
            $ref: "#/components/schemas/UnitOption"
        defaultUnits:
          $ref: "#/components/schemas/DefaultUnits"
    MetricList:
      type: array
      description: >-
        Metrics listed for an endpoint. Use `/metrics` to look up units: some endpoints return metric IDs their own list omits. Pest and disease metrics are in no list.
      items:
        $ref: "#/components/schemas/Metric"
    WhoAmI:
      type: object
      description: Who the credential on this request belongs to.
      required: [email]
      properties:
        email:
          type: string
          description: The caller's email address, lower-cased.
    ApiKeyAccess:
      type: object
      description: >-
        Whether the caller has API key access. The body is `{}` without it. Only `email` is filled.
      properties:
        email:
          type: string
          description: The caller's email address.
        keyID:
          type: string
          description: Not filled by this API.
        createdBy:
          type: string
          description: Not filled by this API.
        createdAt:
          type: integer
          format: int64
          description: Not filled by this API.
    ApiKeyRotation:
      type: object
      description: >-
        Result of rotating the caller's API key. Failures also come back as 200, with `status` `error` and a `detail`.
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` or `error`.'
        newKey:
          type: string
          description: >-
            The new API key, to send as the `x-api-key` header. It is the base64 of `<email>|<key>` and is shown once.
        detail:
          type: string
          description: Why the rotation failed.
    Site:
      type: object

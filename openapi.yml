        - $ref: "#/components/parameters/SiteID"
        - $ref: "#/components/parameters/FilePath"
        - name: redirect
          in: query
          description: '`true` to get a 302 to the file instead of a JSON body.'
          schema:
            type: string
      responses:
        "200":
          description: The download URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreSignedURLResponse"
        "302":
          description: >-
            With `redirect=true`. `disableRedirects` does not apply here. The body repeats the URL as `{"code":302,"message":"redirect","location":"<url>"}`, with no Content-Type.
          headers:
            Location:
              description: Presigned download URL, valid for 15 minutes.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

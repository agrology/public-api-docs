  /summaries/microclimate/customer/{customerID}:
    get:
      summary: Get forecast and actual summaries for a customer's sites
      description: >-
        Maximum, minimum and mean of one metric for every site of the customer you can access. Past rows come from sensors, one per `step`. Forecast rows are not combined: each stored forecast point gets its own row, with `ts` rounded to the nearest `step`, so a `ts` can repeat. Returns 401 when you can access none of the sites. If one site fails, the whole request gets a 400, and a failed database connection can surface as a 502. A missing or out-of-range `step`, `count`, `afterCount`, `afterStep` or `metrics` reads "no valid timeRange provided"; an unknown metric or source reads "invalid metric name provided". Samples are `SummarySample`. Do not ask for `format=csv`: at 2.0 and 2.1 it gives a 200 with an empty body. At 2.1 and 2.2, samples can land on the wrong node when the response has more than one node.
      operationId: getMicroclimateSummaryByCustomer
      tags:
        - Timeseries
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerID"
        - name: metrics
          in: query
          required: true
          description: The one metric to summarize. `metric` is accepted as an alias.
          schema:
            type: string
            enum: [airTemp, humidity, dewPoint, vpd]
        - name: step
          in: query
          required: true
          description: Step length in seconds, 3600 to 86400.
          schema:
            type: integer
        - name: count
          in: query
          required: true
          description: >-
            Past window, 0 to 6: `count` + 1 steps back from the start of the current step. Rows are rounded to the nearest `step`, so the first and last can cover only part of one. `afterCount` defaults to this value, so 6 needs an explicit `afterCount` of 4 or less.
          schema:
            type: integer
        - name: afterCount
          in: query
          description: >-
            Forecast window, 0 to 6, and at most 10 with `count`: forecasts run `afterCount` times `afterStep` seconds past the start of the current step. Defaults to `count`.
          schema:
            type: integer
        - name: afterStep
          in: query
          description: >-
            Seconds per `afterCount`, 3600 to 86400. It sets only the end of the forecast window. Defaults to `step`.
          schema:
            type: integer
        - name: source
          in: query
          description: >-
            Forecast source: `mc` for microclimate predictions (the default) or `ws` for weather forecasts.
          schema:
            type: string
            enum: [mc, ws]
        - $ref: "#/components/parameters/ResponseVersion"
        - $ref: "#/components/parameters/DisableRedirects"
      responses:
        "200":
          description: The summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeseries"
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

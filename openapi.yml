    put:
      summary: Get an upload URL for a customer file
      description: >-
        No request body. Returns a presigned URL, valid for 15 minutes: PUT the file to `uploadUrl`. `file` must be under `uploads/customer/portal/` and must not end in `/`; anything else is a 400. A timestamp folder goes before the file name, so `uploads/customer/portal/a.csv` is stored as `uploads/customer/portal/<epoch seconds>/a.csv`, and `url` gives the stored location. Needs Editor access to the customer.
      operationId: putFileByCustomer
      tags:
        - Files
      security:
        - publicApiAuthorizer: []
        - apiKey: []

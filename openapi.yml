    get:
      summary: Get a download URL for a customer file
      description: >-
        Returns a presigned URL for a file in the customer's storage, valid for 15 minutes, or with `redirect=true` a 302 to it. The file is not checked: a key that does not exist still gets a URL, which then fails. Needs Viewer access to the customer.
      operationId: getFileByCustomer
      tags:

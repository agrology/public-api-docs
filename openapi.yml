          type: string
          description: Chart ID.
        customerID:
          type: string
          description: Customer that owns the chart.
        description:
          type: string
          description: Chart title.
        folder:
          type: string
          description: Folder the chart is filed under.
        definition:
          type: string
          description: >-
            The chart's query definition, a JSON document encoded as a string.
        settings:
          type: string
          description: Display settings, a JSON document encoded as a string.
        createdAt:
          type: integer
          format: int64
          description: When the chart was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the chart, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the chart last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the chart, usually an email address.
    LibraryCharts:
      type: array
      description: Library charts.
      items:
        $ref: "#/components/schemas/LibraryChart"
    FeedbackSubmission:
      type: object
      description: >-
        Feedback about an Agrology app. A missing or empty required field is a 400.
      required: [client, clientVersion, feedbackType, customer, remarks]
      properties:
        id:
          type: string
          description: Ignored. The server assigns the ID and returns it.
        ts:
          type: integer
          format: int64
          description: Ignored. The server sets the time.
        submitter:
          type: string
          description: Ignored. The server uses the caller.
        customer:
          type: string
          description: ID of the customer selected in the client.
        client:
          type: string
          description: Name of the client sending the feedback, such as Agrology iOS.
        clientVersion:
          type: string
          description: Semantic version of the client.
        feedbackType:
          type: string
          description: >-
            Subject of the feedback, as free-form text. Any non-empty value is accepted.
        remarks:
          type: string
          description: The user's feedback, as free-form text.
        wantsFollowUp:
          type: boolean
          description: '`true` if the user wants to be contacted about this feedback.'
        isTestMessage:
          type: boolean
          description: >-
            `true` for a test submission that the customer success team can ignore.
        appLocation:
          type: string
          description: >-
            URI or description of where in the app the feedback form was opened.
    Experiment:
      type: object
      description: >-
        A science experiment. `startTime` and `endTime` are in milliseconds; other times here are in seconds. Fields left empty are omitted.
      required: [customerID, id, startTime, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        customerID:
          type: string
          description: Customer that owns the experiment.
        id:
          type: string
          description: Experiment ID.
        description:
          type: string
          description: Experiment title.
        status:
          type: string
          description: >-
            `planned`, `ongoing` or `completed`. Not validated; use `unset` to clear it. Rollups run only for `ongoing`. Once `endTime` has passed, a rollup run can set `completed`.
        notes:
          type: string
          description: Free-form notes.
        startTime:
          type: integer
          format: int64
          description: >-
            When the experiment starts, in epoch milliseconds. Rollups start here.
        endTime:
          type: integer
          format: int64
          description: >-
            When the experiment ends, in epoch milliseconds. Omitted while it has no end.
        notice:
          type: string
          description: Temporary message to show the user about this experiment.
        noticeLevel:
          type: string
          description: Severity of `notice`, such as `info`, `warning` or `error`.
        noticeExpires:
          type: integer
          format: int64
          description: When `notice` stops applying, in epoch seconds.
        nextOperation:
          type: string
          description: >-
            Next job for the rollup agent, such as `regenerate`. Rollups run only while the experiment is `ongoing`, and each run clears this, even one that finds nothing to roll up.
        positionFilter:
          type: string
          description: >-
            Display name of the one position to include, such as `Canopy` or `Soil Chamber`. It applies to ground-truth metrics only; synthetic metrics use every position. An unknown name is ignored.
        createdAt:
          type: integer
          format: int64
          description: When the experiment was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the experiment, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: >-
            When the experiment last changed, in epoch seconds. Rollup runs change this too, as do metric changes and adding or removing members.
        lastModifiedBy:
          type: string
          description: >-
            Who last changed the experiment. This can be the rollup agent rather than a person.
    Experiments:
      type: array
      description: Experiments.
      items:
        $ref: "#/components/schemas/Experiment"
    ExperimentGroup:
      type: object
      description: >-
        A set of nodes within an experiment, such as the control or the trial. Fields left empty are omitted.
      required: [experimentID, id, groupType, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        experimentID:
          type: string
          description: Experiment the group belongs to.
        id:
          type: string
          description: Group ID.
        description:
          type: string
          description: Group name.
        groupType:
          type: string
          description: >-
            Kind of group. The portal offers `control`, `trial` and `other`; any string is stored.
        notes:
          type: string
          description: Free-form notes.
        icon:
          type: string
          description: Icon to show for the group.
        color:
          type: string
          description: Color to show for the group.
        createdAt:
          type: integer
          format: int64
          description: When the group was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the group, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the group last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the group, usually an email address.
    ExperimentGroups:
      type: array
      description: Experiment groups.
      items:
        $ref: "#/components/schemas/ExperimentGroup"
    ExperimentMember:
      type: object
      description: A node in an experiment group. Empty optional fields are omitted.
      required: [groupID, nodeID, experimentID, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        groupID:
          type: string
          description: Group the node is in.
        nodeID:
          type: string
          description: The node.
        experimentID:
          type: string
          description: >-
            Experiment whose node list includes this member, as last sent in a body. It can differ from the group's experiment, and is an empty string once `unset` removes it.
        color:
          type: string
          description: Color to show for the node.
        createdAt:
          type: integer
          format: int64
          description: When the member was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the member, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the member last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the member, usually an email address.
    ExperimentMembers:
      type: array
      description: Experiment members.
      items:
        $ref: "#/components/schemas/ExperimentMember"
    ExperimentMetric:
      type: object
      description: >-
        A metric rolled up for an experiment. It appears as a `metric|nodeAggregator|statistic` column in the experiment data, with `statistic` lowercased and empty parts as `mean`. Metrics that render the same column name at the same `resolution` share a column.
      required: [experimentID, id, metricID, statistic, resolution, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        experimentID:
          type: string
          description: Experiment the metric belongs to.
        id:
          type: string
          description: Experiment metric ID.
        metricID:
          type: string
          description: >-
            ID of the metric to roll up. Needed on create: it is not enforced, and a missing or unknown ID gives no data.
        statistic:
          type: string
          description: >-
            How the values of the nodes in a group combine: `mean`, `sum`, `min`, `max`, `median`, `geomean`, `varsamp`, `stddevsamp`, `varpop`, `stddevpop`, `runningTotal` or `rawValue`. Case-sensitive. Empty means `mean`. `rawValue` takes one value instead of combining, so use it only for single-node groups. `runningTotal` sums the nodes and accumulates only within each rollup run: after a full rebuild it is a total from `startTime`, until the next scheduled run restarts the latest periods from zero.
        resolution:
          type: integer
          description: >-
            Rollup size in seconds: 1800, 3600, 14400, 21600, 43200, 86400, 259200, 604800 or 2592000. Needed on create: other values, including a missing one, are stored, but the data operations reject them.
        nodeAggregator:
          type: string
          description: >-
            How each node's samples in a rollup period combine, before `statistic`. It takes the same values as `statistic`, except that `runningTotal` is a plain sum here and `rawValue` keeps every sample. Empty means `mean`.
        createdAt:
          type: integer
          format: int64
          description: When the experiment metric was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the experiment metric, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the experiment metric last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the experiment metric, usually an email address.
    ExperimentMetrics:
      type: array
      description: Experiment metrics.
      items:
        $ref: "#/components/schemas/ExperimentMetric"
    Dashboard:
      type: object
      description: A saved dashboard. Fields left empty are omitted.
      required: [id, owner, feature, featureID, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        id:
          type: string
          description: Dashboard ID.
        owner:
          type: string
          description: 'Dashboard owner: an email address or `customer.<customerID>`.'
        feature:
          type: string
          description: Feature the dashboard belongs to.
        featureID:
          type: string
          description: ID of the item within that feature.
        description:
          type: string
          description: Dashboard title.
        notes:
          type: string
          description: Free-form notes.
        notice:
          type: string
          description: Temporary message to show the user about this dashboard.
        noticeLevel:
          type: string
          description: 'Severity of `notice`: `info`, `warning`, `error` or `success`.'
        status:
          type: string
          description: >-
            Dashboard status. `deleted` after a delete and `active` after a restore.
        order:
          type: integer
          description: >-
            Position of the dashboard in its collection (same owner and feature ID).
        dataField0:
          type: string
          description: >-
            The live dashboard content, a free-form string owned by the client.
        dataField1:
          type: string
          description: Rollback version 1, older as the number rises.
        dataField2:
          type: string
          description: Rollback version 2, older as the number rises.
        dataField3:
          type: string
          description: Rollback version 3, older as the number rises.
        dataField4:
          type: string
          description: Rollback version 4, older as the number rises.
        dataField5:
          type: string
          description: Rollback version 5, older as the number rises.
        dataField6:
          type: string
          description: Rollback version 6, older as the number rises.
        dataField7:
          type: string
          description: Rollback version 7, older as the number rises.
        dataField8:
          type: string
          description: Rollback version 8, older as the number rises.
        dataField9:
          type: string
          description: Rollback version 9, older as the number rises.
        createdAt:
          type: integer
          format: int64
          description: When the dashboard was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the dashboard, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the dashboard last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the dashboard, usually an email address.
    Dashboards:
      type: array
      description: Dashboards, including deleted ones until they expire.
      items:
        $ref: "#/components/schemas/Dashboard"
    CustomerInput:
      type: object
      description: A record of something the customer did or saw in the field.
      required: [customerID, id, category, data, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        customerID:
          type: string
          description: Customer that owns the input.
        id:
          type: string
          description: Customer input ID.
        category:
          type: string
          description: Category name, from `/customer-inputs/categories`.
        data:
          type: object
          nullable: true
          description: Values by key. Null if none were sent.
        createdAt:
          type: integer
          format: int64
          description: When the input was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the input, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the input last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the input, usually an email address.
    CustomerInputs:
      type: array
      description: Customer inputs.
      items:
        $ref: "#/components/schemas/CustomerInput"
    PreSignedURLResponse:
      type: object
      description: >-
        A presigned S3 URL for one file. Presigned URLs are valid for 15 minutes.
      required: [url, file]
      properties:
        uploadUrl:
          type: string
          description: Presigned URL to PUT the file to. Upload only.
        url:
          type: string
          description: >-
            On download, the presigned URL to GET the file. On upload, the URL of the stored object without its signature, which is not a download link.
        file:
          type: string
          description: >-
            File name: the last part of the key. On upload this is the name you sent; the stored key, with its timestamp folder, is in `url`.
    CustomerFile:
      type: object
      description: >-
        A file shared with a customer, such as a photo or a PDF. Empty optional fields are omitted.
      required: [customerID, id, filename, folder, siteID, createdAt, createdBy, lastModified, lastModifiedBy]
      properties:
        customerID:
          type: string
          description: Customer the file belongs to.
        id:
          type: string
          description: File ID.
        description:
          type: string
          description: File title.
        filename:
          type: string
          description: File name.
        folder:
          type: string
          description: Folder the file is filed under.
        fileType:
          type: string
          description: Kind of file.
        status:
          type: string
          description: Processing status. This list returns only `success`.
        notes:
          type: string
          description: Free-form notes.
        siteID:
          type: string
          description: Site the file relates to.
        nodeID:
          type: string
          description: Node the file relates to.
        deviceID:
          type: string
          description: Device the file relates to.
        gatewayID:
          type: string
          description: Gateway the file relates to.
        s3url:
          type: string
          description: Where the file is stored.
        s3ThumbUrl:
          type: string
          description: Where its thumbnail is stored.
        gpsLatitude:
          type: number
          format: double
          description: Latitude recorded with the file.
        gpsLongitude:
          type: number
          format: double
          description: Longitude recorded with the file.
        gpsBearing:
          type: number
          format: double
          description: Compass bearing recorded with the file.
        gpsAltitude:
          type: integer
          description: Altitude recorded with the file.
        imageOrientation:
          type: integer
          description: Image orientation, from the image metadata.
        imageHeight:
          type: integer
          description: Image height in pixels.
        imageWidth:
          type: integer
          description: Image width in pixels.
        imageDPI:
          type: integer
          description: Image resolution in dots per inch.
        visibleToCustomer:
          type: integer
          description: >-
            `1` when the customer can see the file. Always `1` in this list.
        createdAt:
          type: integer
          format: int64
          description: When the file was created, in epoch seconds.
        createdBy:
          type: string
          description: Who created the file, usually an email address.
        lastModified:
          type: integer
          format: int64
          description: When the file last changed, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who last changed the file, usually an email address.
    CustomerFiles:
      type: array
      description: Files shared with the customer, ordered by ID.
      items:
        $ref: "#/components/schemas/CustomerFile"
    Timeseries:
      description: >-
        Timeseries response. The shape depends on `responseVersion`: 2.0, the default, nests nodes in an array; 2.1 and 2.2 key nodes, sites and devices by ID; 2.2, the latest, adds per-metric `metrics` info. With `disableRedirects=1`, a body over 5,000,000 bytes is a `RedirectBody` instead.
      anyOf:
        - $ref: "#/components/schemas/TimeseriesV20"
        - $ref: "#/components/schemas/TimeseriesV21"
        - $ref: "#/components/schemas/TimeseriesV22"
        - $ref: "#/components/schemas/RedirectBody"
    ExperimentData:
      description: >-
        Experiment data, always at response version 2.2. With `disableRedirects=1`, a body over 5,000,000 bytes is a `RedirectBody` instead.
      anyOf:
        - $ref: "#/components/schemas/TimeseriesV22"
        - $ref: "#/components/schemas/RedirectBody"
    TimeseriesV20:
      type: object
      description: >-
        Response version 2.0, the default. `request` is never sent at this version. `metric` is sent only by microclimate summaries, and `site` and `siteId` are absent on those.
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` when the request succeeded.'
        detail:
          type: string
          description: Extra information about the response. Usually absent.
        warnings:
          type: array
          description: >-
            Problems met while building the response. The rest of the response still stands.
          items:
            type: string
        request:
          $ref: "#/components/schemas/RequestSummary"
        site:
          type: string
          description: Site display name.
        siteId:
          type: string
          description: Site ID.
        metric:
          $ref: "#/components/schemas/Metric"
        nodes:
          type: array
          description: >-
            One entry per node. Ground-truth rows with no known node are under a node with `id` `none`.
          items:
            $ref: "#/components/schemas/TimeseriesNodeV20"
    TimeseriesV21:
      type: object
      description: >-
        Response version 2.1. `request` is absent on microclimate summaries, which also are the only responses with `metric`.
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` when the request succeeded.'
        detail:
          type: string
          description: Extra information about the response. Usually absent.
        warnings:
          type: array
          description: >-
            Problems met while building the response. The rest of the response still stands.
          items:
            type: string
        request:
          $ref: "#/components/schemas/RequestSummary"
        sites:
          type: object
          description: >-
            Sites in the response, by site ID. Absent on microclimate summaries.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesSiteInfo"
        devices:
          type: object
          description: >-
            Devices in the response, by device ID. Ground truth only. With `consolidateNodePositionMetrics=1` the keys are `<nodeID>-<positionID>`, or `<nodeID>` for a device with no position.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesDeviceInfo"
        metric:
          $ref: "#/components/schemas/Metric"
        nodes:
          type: object
          description: >-
            Nodes by node ID. Except on historical weather, rows with no known node are under `none`, with `id` and `name` also `none` and no `siteId`.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesNodeV21"
    TimeseriesV22:
      type: object
      description: >-
        Response version 2.2, the latest, and the only version for experiment data. `request` here carries only `format`, `requestTime`, `source`, `timeRange`, `responseVersion` and `refID`, and is absent on microclimate summaries, which also are the only responses with `metric`.
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` when the request succeeded.'
        detail:
          type: string
          description: Extra information about the response. Usually absent.
        warnings:
          type: array
          description: >-
            Problems met while building the response. The rest of the response still stands.
          items:
            type: string
        request:
          $ref: "#/components/schemas/RequestSummary"
        organization:
          type: string
          description: Customer ID. Sent only on experiment data.
        metrics:
          type: object
          description: >-
            Metrics in the response, by metric ID. Absent on microclimate summaries and pest and disease.
          additionalProperties:
            $ref: "#/components/schemas/MetricInfo"
        experiment:
          $ref: "#/components/schemas/TimeseriesExperiment"
        sites:
          type: object
          description: >-
            Sites in the response, by site ID. Absent on microclimate summaries. Also absent on experiment data.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesSiteInfo"
        devices:
          type: object
          description: >-
            Devices in the response, by device ID. Ground truth only. With `consolidateNodePositionMetrics=1` the keys are `<nodeID>-<positionID>`, or `<nodeID>` for a device with no position.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesDeviceInfo"
        metric:
          $ref: "#/components/schemas/Metric"
        nodes:
          type: object
          description: >-
            Nodes by node ID. Except on historical weather, rows with no known node are under `none`, with `id` and `name` also `none` and no `siteId`. Absent on experiment data, which is under `experiment`.
          additionalProperties:
            $ref: "#/components/schemas/TimeseriesNodeV22"
    TimeseriesNodeV20:
      type: object
      description: One node at response version 2.0.
      properties:
        name:
          type: string
          description: Node display name.
        id:
          type: string
          description: Node ID.
        samples:
          type: array
          description: Samples for this node.
          items:
            anyOf:
              - $ref: "#/components/schemas/SampleV20"
              - $ref: "#/components/schemas/SummarySample"
    TimeseriesNodeV21:
      type: object
      description: One node at response version 2.1.
      properties:
        name:
          type: string
          description: Node display name.
        id:
          type: string
          description: Node ID.
        siteId:
          type: string
          description: ID of the site the node belongs to.
        samples:
          type: array
          description: Samples for this node.
          items:
            anyOf:
              - $ref: "#/components/schemas/SampleV21"
              - $ref: "#/components/schemas/SummarySample"
    TimeseriesNodeV22:
      type: object
      description: >-
        One node at response version 2.2. Weather and microclimate predictions and synthetics use `SampleV20`, except at calendar-month resolution. Microclimate summaries use `SummarySample`. Everything else uses `SampleV21`.
      properties:
        name:
          type: string
          description: Node display name.
        id:
          type: string
          description: Node ID.
        siteId:
          type: string
          description: ID of the site the node belongs to.
        samples:
          type: array
          description: Samples for this node.
          items:
            anyOf:
              - $ref: "#/components/schemas/SampleV20"
              - $ref: "#/components/schemas/SampleV21"
              - $ref: "#/components/schemas/SummarySample"
    SampleV20:
      type: object
      description: >-
        A flat sample: `ts`, optional `dev`, `position` and `deviceType`, and one number per metric ID.
      required: [ts]
      properties:
        ts:
          type: integer
          format: int64
          description: Sample time, in epoch seconds.
        dev:
          type: string
          description: >-
            Device the sample came from (ground truth). With `consolidateNodePositionMetrics=1`, `<nodeID>-<positionID>`, or absent for a device with no position.
        position:
          type: string
          description: Position name of the device (ground truth).
        deviceType:
          type: string
          description: Device type ID (ground truth).
      additionalProperties:
        description: A metric value, or a metadata string.
        anyOf:
          - type: number
          - type: string
    SampleV21:
      type: object
      description: A sample with its metrics under `d`.
      properties:
        dev:
          type: string
          description: >-
            Device the sample came from (ground truth). With `consolidateNodePositionMetrics=1`, `<nodeID>-<positionID>`, or absent for a device with no position.
        deviceType:
          type: string
          description: Never sent. Device types are under `devices`.
        ts:
          type: integer
          format: int64
          description: Sample time, in epoch seconds.
        d:
          type: object
          description: Metric values by metric ID.
          additionalProperties:
            type: number
        m:
          type: object
          description: Other metadata as strings.
          additionalProperties:
            type: string
    SummarySample:
      type: object
      description: >-
        One summary step. A value is `null` when it has no data. Units are those of the response `metric`.
      required: [ts, max, min, mean]
      properties:
        ts:
          type: integer
          format: int64
          nullable: true
          description: Time of the step, in epoch seconds.
        max:
          type: number
          nullable: true
          description: Largest value in the step.
        min:
          type: number
          nullable: true
          description: Smallest value in the step.
        mean:
          type: number
          nullable: true
          description: Mean value in the step.
    RequestSummary:
      type: object
      description: What the server understood the request to be.
      properties:
        requestTime:
          type: integer
          format: int64
          description: Time the request was received, in epoch seconds.
        source:
          type: string
          description: >-
            Data source: `historical/ground-truth`, `historical/weather`, `predictions/weather`, `predictions/microclimate`, `predictions/pest-disease`, `synthetics/microclimate` or `rollups/experiments`.
        customerID:
          type: string
          description: Customer ID from the path.
        siteId:
          type: string
          description: Site ID from the path.
        nodeId:
          type: string
          description: Node ID from the path.
        deviceId:
          type: string
          description: Device ID from the path.
        timeRange:
          type: string
          description: '`timeRange` as sent.'
        format:
          type: string
          description: '`json` or `csv`.'
        responseVersion:
          type: string
          description: Response version used.
        metrics:
          type: array
          description: Metric IDs requested.
          items:
            type: string
        refID:
          type: string
          description: '`refID` as sent.'
    TimeseriesSiteInfo:
      type: object
      description: A site in a timeseries response.
      properties:
        name:
          type: string
          description: Site display name.
        id:
          type: string
          description: Site ID.
    TimeseriesDeviceInfo:
      type: object
      description: A device, or a consolidated node position, in a timeseries response.
      properties:
        id:
          type: string
          description: >-
            Device ID, or `<nodeID>-<positionID>` when consolidated. Absent for a consolidated device with no position.
        position:
          type: string
          description: Position name.
        deviceType:
          type: string
          description: Device type ID.
    MetricInfo:
      type: object
      description: >-
        A metric in a 2.2 response. Use `/metrics` for unit options; this has none.
      required: [id, name]
      properties:
        id:
          type: string
          description: Metric ID.
        name:
          type: string
          description: Display name on experiment data. Empty on other responses.
        description:
          type: string
          description: Metric description.
        units:
          type: string
          description: Units of the values.
        type:
          type: string
          description: '`number` or `string`. On experiment data, `string` or absent.'
    TimeseriesExperiment:
      type: object
      description: An experiment and its data.
      properties:
        id:
          type: string
          description: Experiment ID.
        description:
          type: string
          description: Experiment description.
        notes:
          type: string
          description: Experiment notes.
        groups:
          type: array
          description: Experiment groups with data.
          items:
            $ref: "#/components/schemas/TimeseriesGroup"
    TimeseriesGroup:
      type: object
      description: An experiment group.
      required: [id, description]
      properties:
        id:
          type: string
          description: Group ID.
        description:
          type: string
          description: Group description.
        groupType:
          type: string
          description: Group type.
        icon:
          type: string
          description: Icon name.
        color:
          type: string
          description: Display color.
        data:
          $ref: "#/components/schemas/TimeseriesGroupData"
    TimeseriesGroupData:
      type: object
      description: Rows of experiment data for one group.
      required: [start, end, resolution, metrics, statistics, columns, rows]
      properties:
        start:
          type: integer
          format: int64
          description: Earliest row time, in epoch seconds.
        end:
          type: integer
          format: int64
          description: Latest row time, in epoch seconds.
        resolution:
          type: integer
          format: int64
          description: Row spacing in seconds.
        metrics:
          type: array
          nullable: true
          description: Metric IDs in `columns`.
          items:
            type: string
        nodeAggregators:
          type: array
          description: Node aggregators in `columns`.
          items:
            type: string
        statistics:
          type: array
          nullable: true
          description: Statistics in `columns`.
          items:
            type: string
        columns:
          type: array
          nullable: true
          description: >-
            `ts`, then one `metric|nodeAggregator|statistic` per value column.
          items:
            type: string
        rows:
          type: array
          nullable: true
          description: >-
            One array per row, in `columns` order: `ts` in epoch seconds, then a number or `null` for each value column.
          items:
            type: array
            items:
              nullable: true
              description: "`ts`, or a column value."
    RedirectBody:
      type: object
      description: Body of a redirected response.
      required: [code, message, location]
      properties:
        code:
          type: integer
          description: Always 302, even when `disableRedirects=1` makes the status 200.
        message:
          type: string
          description: Always `redirect`.
        location:
          type: string
          description: >-
            Presigned S3 URL of the full response body. It expires after 1 hour.
  securitySchemes:
    publicApiAuthorizer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API key issued by Agrology. Rotate it with POST /apikey.

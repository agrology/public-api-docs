servers:
  - url: https://api.agrology.ag/v2
paths:
  /feedback:
    post:
      summary: Send feedback to Agrology
      description: >-
        Any logged-in caller can send feedback. The 400 for a missing field nests JSON in `message`, so treat it as text.
      operationId: submitFeedback
      tags:
        - Feedback
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "201":
          description: The feedback was sent. `id` is its ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "500":
          description: Feedback could not be delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /access:
    get:
      summary: List the sites and nodes you can access
      description: >-
        Every customer, site and node the caller holds a grant for, with the caller's role at each site. Cached for 5 minutes per caller; pass `refresh` to rebuild the cache.
      operationId: getUserAccess
      tags:
        - Identity
      parameters:
        - name: refresh
          in: query
          description: Any non-empty value clears this caller's 5-minute cache.
          schema:
            type: string
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      responses:
        "200":
          description: The caller's access list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /apikey-access:
    get:
      summary: Show whether you have API key access
      description: >-
        Returns your email if you have API key access, and `{}` if you do not. A valid credential with no customer or site grants gets a 401, and a failed lookup gets a 400.
      operationId: getApiKeyAccess
      tags:
        - Identity
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      responses:
        "200":
          description: Your API key access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /whoami:
    get:
      summary: Show who the credential belongs to
      description: >-
        Works with a Bearer token or an API key. A valid credential with no customer or site grants gets a 401.
      operationId: getWhoAmI
      tags:
        - Identity
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /apikey:
    post:
      summary: Rotate your API key
      description: >-
        Replaces your API key. Authorization caches can keep the previous key working for a while afterwards, normally about 10 minutes, so do not rely on rotation to end access at once. Send no body. Returns 401 without API key access. A failed rotation also returns 200, with `status` `error`, and may already have deleted the previous key. Retry at once or with a Bearer token, since a caller using only that key is locked out when the caches expire. The new key is the base64 of `<email>|<key>` and is shown once.
      operationId: rotateApiKey
      tags:
        - Identity
      security:
        - publicApiAuthorizer: []
        - apiKey: []
      responses:
        "200":
          description: The result of the rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

      properties:
        id:
          type: string
          description: Unique ID.
        displayName:
          type: string
          description: Name for display.
        aka:
          type: string
          description: Another name this record is known by.
        status:
          type: string
          description: Lifecycle status, e.g. `active` or `inactive`.
        notes:
          type: string
          description: Free-form notes.
        lastModified:
          type: integer
          format: int64
          description: Time of the last change, in epoch seconds.
        lastModifiedBy:
          type: string
          description: Who made the last change.
        lat:
          type: number
          description: Latitude in decimal degrees.
        long:
          type: number
          description: Longitude in decimal degrees.
        polygon:
          type: string
          description: >-
            Boundary as text: `long,lat` pairs split by `;`, with `|` between polygons.
        elevation:
          type: integer
          description: Elevation in metres.
        report_time:
          type: integer
          format: int64
          description: Time of the last report.
        report_time_hr:
          type: string
          description: '`report_time` in readable form.'
        reportingStatus:
          type: string
          description: Reporting status from fleet monitoring.
        statusDetail:
          type: string
          description: Detail for `reportingStatus`.
        ingest_time:
          type: integer
          format: int64
          description: Time the last report was ingested.
        ingest_time_hr:
          type: string
          description: '`ingest_time` in readable form.'
        isAlarming:
          type: boolean
          description: True when monitoring has raised an alarm.
        lastMonitoredReport:
          type: integer
          format: int64
          description: Time of the last report seen by monitoring.
        monitorNum:
          type: integer
          format: int64
          description: Number passed between monitoring jobs. Not stored.
        monitorDec:
          type: number
          description: Decimal passed between monitoring jobs. Not stored.
        monitorStr:
          type: string
          description: Text passed between monitoring jobs. Not stored.
        hwMonitoringStatus:
          type: integer
          format: int64
          description: Hardware monitoring state; 0 means monitoring is off.
        hwMonitoringDetail:
          type: integer
          format: int64
          description: Detail code for `hwMonitoringStatus`.
        hwMonitoringDisableUntil:
          type: integer
          format: int64
          description: Time hardware monitoring stays disabled until.
        envMonitoringStatus:
          type: integer
          format: int64
          description: Environmental monitoring state; 0 means monitoring is off.
        opNote:
          type: string
          description: Operational note.
        customer:
          type: string
          description: ID of the customer that owns the site.
        customerName:
          type: string
          description: Not filled by this API.
        address1:
          type: string
          description: Address line 1.
        address2:
          type: string
          description: Address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State or province.
        postalCode:
          type: string
          description: Postal code.
        country:
          type: string
          description: Country.
        contactName:
          type: string
          description: Site contact name.
        email:
          type: string
          description: Site contact email.
        phone:
          type: string
          description: Site contact phone.
        tz:
          type: string
          description: Time zone name, e.g. `America/Los_Angeles`.
        irrigationSummary:
          type: string
          description: Free-form irrigation schedule.
        sizeAcres:
          type: number
          description: Approximate size in acres.
        accessInfo:
          type: string
          description: Free-form notes on access to the site.
        siteClassification:
          type: string
          description: Label for the site, such as `Site`, `Facility` or `Lab`.
        grafanaEnabled:
          type: boolean
          description: True if the site can be viewed in Grafana.
        displayUnits:
          type: string
          description: Units of measurement at the site, `metric` or `imperial`.
        products:
          type: array
          description: Products active at the site.
          items:
            type: string
    Sites:
      type: array
      description: The sites the caller can access.
      items:
        $ref: "#/components/schemas/Site"
    Node:
